name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      # 환경변수 없이도 빌드가 되어야 한다(연락 폼은 mailto로, 카운터는 숨김으로 폴백).
      - run: bun run build
